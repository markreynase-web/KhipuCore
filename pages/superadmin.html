<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhipuCore — Super administrador</title>
<link rel="icon" href="../assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/panel-lateral.css">
<style>
  body{ background:var(--paper); }
  .sa-shell{ max-width:1040px; margin:0 auto; padding:28px 24px 20px; }
  .sa-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .sa-brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .sa-brand img{ width:34px; height:34px; }
  .sa-brand-text{ display:flex; align-items:center; gap:8px; font-family:'Inter', sans-serif; font-weight:800; font-size:16px; color:var(--ink); }
  .sa-brand-tag{ font-size:11px; font-weight:700; color:var(--teal-deep); background:var(--teal-soft); padding:3px 9px; border-radius:20px; }
  .sa-panel{ background:#fff; border-radius:14px; padding:24px; box-shadow:var(--card-shadow); margin-bottom:20px; }
  .sa-panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sa-panel-header h2{ font-family:'Inter', sans-serif; font-size:16px; font-weight:700; margin:0; color:var(--ink); }
  .sa-modulos-lista{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin:14px 0 0; }
  .sa-modulo-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--paper-line); border-radius:9px; font-size:13.5px; text-transform:none; letter-spacing:normal; color:var(--ink); font-weight:500; }
  .sa-modulo-item input{ width:auto; }
  .sa-estado-badge{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; }
  .sa-estado-badge.activo{ background:#E1F5EE; color:#0F6E56; }
  .sa-estado-badge.inactivo{ background:#FBEAF0; color:#993556; }
  .sa-acceso-denegado{ text-align:center; padding:80px 20px; color:var(--muted); }
  .sa-acceso-denegado h2{ font-family:'Inter', sans-serif; color:var(--ink); }
  .sa-subtitulo{ font-family:'Inter', sans-serif; font-size:13px; margin:20px 0 8px; color:var(--ink); font-weight:700; }
</style>
</head>
<body>

<div class="sa-shell">
  <div class="sa-header">
    <a class="sa-brand" href="../index.html" title="Ir a la página principal">
      <img src="../assets/logo-icon.png" alt="KhipuCore">
      <div class="sa-brand-text">KhipuCore <span class="sa-brand-tag">Super Admin</span></div>
    </a>
    <button type="button" class="btn btn-ghost" id="btnCerrarSesion" style="color:var(--ink); border:1px solid var(--paper-line);">Cerrar sesión</button>
  </div>

  <div id="contenido">Cargando…</div>

  <footer></footer>
</div>

<script type="module">
  import { haySesionActiva, obtenerSesion, cerrarSesion, esSuperAdmin } from '../js/sesion.js';
  import { API_BASE_URL } from '../js/apiConfig.js';
  import { abrirPanelLateral } from '../components/panelLateral.js';
  import { renderFooter } from '../components/footer.js';
  import { escapeHtml } from '../js/utils.js';

  renderFooter();

  // Paquetes de módulos por perfil de negocio: activar uno de un clic en vez
  // de tildar checkbox por checkbox. Solo ACTIVAN (nunca desactivan) -- si
  // la empresa ya tenía otros módulos prendidos, se quedan como están.
  const PAQUETES = {
    taller: {
      icono: '🔧', label: 'Taller Mecánico',
      modulos: ['clientes', 'finanzas', 'vehiculos', 'repuestos', 'postventa', 'agenda']
    },
    concesionaria: {
      icono: '🚗', label: 'Concesionaria',
      modulos: ['clientes', 'finanzas', 'ventas', 'inventario', 'vehiculos', 'repuestos', 'postventa', 'agenda']
    },
    dental: {
      icono: '🦷', label: 'Clínica Dental',
      modulos: ['clientes', 'finanzas', 'tratamientos', 'planes_tratamiento', 'seguros_dentales', 'agenda']
    },
    optica: {
      icono: '👓', label: 'Óptica',
      modulos: ['clientes', 'finanzas', 'recetas_opticas', 'ordenes_laboratorio', 'seguros_vision', 'agenda']
    }
  };

  if (!haySesionActiva()) location.replace('login.html');

  const contenido = document.getElementById('contenido');
  document.getElementById('btnCerrarSesion').addEventListener('click', () => {
    cerrarSesion();
    location.replace('login.html');
  });

  if (!esSuperAdmin()) {
    contenido.innerHTML = `
      <div class="sa-acceso-denegado">
        <h2>Acceso restringido</h2>
        <p>Tu cuenta no tiene permisos de super administrador.</p>
      </div>`;
  } else {
    iniciar();
  }

  function headerAuth() {
    const token = obtenerSesion()?.token;
    return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  // alert() a propósito: este panel no es de cara al cliente final, lo usa
  // un super admin -- no vale la pena construir un sistema de notificaciones
  // aparte para un puñado de acciones de back-office.
  async function api(path, opciones) {
    try {
      const res = await fetch(`${API_BASE_URL}${path}`, { headers: headerAuth(), ...opciones });
      if (!res.ok) {
        const cuerpo = await res.json().catch(() => ({}));
        throw new Error(cuerpo.error || `HTTP ${res.status}`);
      }
      if (res.status === 204) return true;
      return await res.json();
    } catch (err) {
      alert(err.message);
      return null;
    }
  }

  async function iniciar() {
    contenido.innerHTML = `
      <div class="sa-panel">
        <div class="sa-panel-header">
          <h2>Empresas</h2>
          <button type="button" class="btn btn-ochre" id="btnNuevaEmpresa">+ Nueva empresa</button>
        </div>
        <div id="formNuevaEmpresaWrap"></div>
        <div id="tablaEmpresas">Cargando…</div>
      </div>
    `;
    document.getElementById('btnNuevaEmpresa').addEventListener('click', toggleFormNuevaEmpresa);
    await cargarEmpresas();
  }

  function toggleFormNuevaEmpresa() {
    const wrap = document.getElementById('formNuevaEmpresaWrap');
    if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <form class="form-registro" id="formNuevaEmpresa" style="margin:16px 0 20px; padding-bottom:20px; border-bottom:1px solid var(--paper-line);">
        <div class="campo"><label>Nombre</label><input type="text" id="nuevaEmpresaNombre" required></div>
        <div class="campo"><label>Logo (iniciales)</label><input type="text" id="nuevaEmpresaLogo" maxlength="4" placeholder="Opcional"></div>
        <div class="campo campo-accion">
          <button type="submit" class="btn btn-ochre">Crear empresa</button>
          <span class="form-status" id="nuevaEmpresaStatus"></span>
        </div>
      </form>
    `;
    document.getElementById('formNuevaEmpresa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nuevaEmpresaNombre').value.trim();
      const logo = document.getElementById('nuevaEmpresaLogo').value.trim();
      const res = await api('/superadmin/empresas', { method: 'POST', body: JSON.stringify({ nombre, logo: logo || undefined }) });
      if (res) { wrap.innerHTML = ''; await cargarEmpresas(); }
    });
  }

  async function cargarEmpresas() {
    const cont = document.getElementById('tablaEmpresas');
    const empresas = await api('/superadmin/empresas');
    if (!empresas) { cont.innerHTML = '<p class="tabla-vacia">No se pudo conectar con el backend.</p>'; return; }
    if (!empresas.length) { cont.innerHTML = '<p class="tabla-vacia">Todavía no hay empresas. Usa "+ Nueva empresa" para crear la primera.</p>'; return; }

    cont.innerHTML = `
      <div class="tabla-registros-wrap">
        <table class="tabla-registros">
          <thead><tr><th>Nombre</th><th>Usuarios</th><th>Módulos</th><th>Estado</th><th class="col-acciones"></th></tr></thead>
          <tbody>
            ${empresas.map(e => `
              <tr data-id="${e.id}">
                <td>${escapeHtml(e.nombre)}</td>
                <td>${e.usuarios_count}</td>
                <td>${e.modulos_count}</td>
                <td><span class="sa-estado-badge ${e.activo ? 'activo' : 'inactivo'}">${e.activo ? 'Activa' : 'Inactiva'}</span></td>
                <td class="col-acciones"><button type="button" class="icon-btn" data-accion="gestionar" title="Gestionar">⚙️</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    cont.querySelectorAll('[data-accion="gestionar"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('tr').dataset.id;
        const empresa = empresas.find(e => String(e.id) === id);
        gestionarEmpresa(empresa);
      });
    });
  }

  function gestionarEmpresa(empresa) {
    abrirPanelLateral({
      titulo: `Gestionar: ${empresa.nombre}`,
      icono: '🏢',
      montar: async (body) => {
        body.innerHTML = 'Cargando módulos…';
        const modulos = await api(`/superadmin/empresas/${empresa.id}/modulos`);
        if (!modulos) { body.innerHTML = 'No se pudieron cargar los módulos.'; return; }

        body.innerHTML = `
          <div class="sa-subtitulo">Nombre</div>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <input type="text" id="empresaNombre" value="${escapeHtml(empresa.nombre)}" style="flex:1; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border:1px solid var(--paper-line); border-radius:8px; background:#fff; color:var(--ink);">
            <button type="button" class="btn btn-ochre" id="btnGuardarNombre">Guardar</button>
          </div>
          <div class="form-status" id="nombreStatus" style="margin:-14px 0 20px;"></div>

          <div class="sa-subtitulo">Estado</div>
          <label class="sa-modulo-item" style="margin-bottom:6px;">
            <input type="checkbox" id="empresaActiva" ${empresa.activo ? 'checked' : ''}>
            Empresa activa (si se desmarca, nadie de esta empresa puede iniciar sesión)
          </label>
          <div class="form-status" id="activoStatus" style="margin-bottom:20px;"></div>

          <div class="sa-subtitulo">Color de marca</div>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <input type="color" id="colorPrimario" value="${empresa.color_primario || '#E3B23C'}" style="width:44px; height:34px; padding:2px; border:1px solid var(--paper-line); border-radius:8px; cursor:pointer;">
            <button type="button" class="btn btn-ghost" id="btnQuitarColor" style="${empresa.color_primario ? '' : 'display:none;'}">Usar el de KhipuCore</button>
            <span class="form-status" id="colorStatus"></span>
          </div>

          <div class="sa-subtitulo">Módulos habilitados</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            ${Object.entries(PAQUETES).map(([id, p]) => `
              <button type="button" class="btn btn-ghost" data-paquete="${id}" style="padding:6px 12px; font-size:12px;" title="Activa de una sola vez los módulos de este paquete (no desactiva nada que ya esté prendido)">
                ${p.icono} ${p.label}
              </button>`).join('')}
          </div>
          <div class="sa-modulos-lista" id="listaModulos">
            ${modulos.map(m => `
              <label class="sa-modulo-item">
                <input type="checkbox" data-modulo="${m.id}" ${m.habilitado ? 'checked' : ''}>
                ${m.icon || ''} ${m.label}
              </label>`).join('')}
          </div>

          <div class="sa-subtitulo" style="margin-top:26px;">Agregar administrador</div>
          <form class="form-registro" id="formAdmin" style="grid-template-columns:1fr;">
            <div class="campo"><label>Nombre</label><input type="text" id="adminNombre" required></div>
            <div class="campo"><label>Correo</label><input type="email" id="adminEmail" required></div>
            <div class="campo"><label>Contraseña (solo si es cuenta nueva)</label><input type="password" id="adminPassword" placeholder="Mínimo 6 caracteres"></div>
            <div class="campo campo-accion">
              <button type="submit" class="btn btn-ochre" style="width:100%; justify-content:center;">Agregar administrador</button>
              <span class="form-status" id="adminStatus"></span>
            </div>
          </form>
        `;

        document.getElementById('btnGuardarNombre').addEventListener('click', async () => {
          const statusEl = document.getElementById('nombreStatus');
          const nuevoNombre = document.getElementById('empresaNombre').value.trim();
          if (!nuevoNombre) {
            statusEl.textContent = 'El nombre no puede estar vacío.';
            statusEl.style.color = 'var(--coral)';
            return;
          }
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ nombre: nuevoNombre })
          });
          if (res) {
            empresa.nombre = nuevoNombre;
            document.getElementById('panelLateralTitulo').textContent = `Gestionar: ${nuevoNombre}`;
            statusEl.textContent = 'Guardado.';
            statusEl.style.color = 'var(--teal)';
            await cargarEmpresas();
          } else {
            statusEl.textContent = 'No se pudo guardar.';
            statusEl.style.color = 'var(--coral)';
          }
        });

        document.getElementById('empresaActiva').addEventListener('change', async (e) => {
          const activo = e.target.checked;
          const statusEl = document.getElementById('activoStatus');
          // Solo se confirma al DESACTIVAR (la dirección riesgosa) -- reactivar
          // es una acción de recuperación, no hace falta frenarla igual.
          if (!activo && !confirm(`¿Desactivar "${empresa.nombre}"? Nadie de esa empresa va a poder iniciar sesión hasta que la reactives.`)) {
            e.target.checked = true;
            return;
          }
          e.target.disabled = true;
          statusEl.textContent = 'Guardando...';
          statusEl.style.color = 'var(--muted)';
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ activo })
          });
          e.target.disabled = false;
          if (res) {
            empresa.activo = activo;
            statusEl.textContent = activo ? 'Guardado: empresa activa.' : 'Guardado: empresa desactivada.';
            statusEl.style.color = 'var(--teal)';
            await cargarEmpresas(); // refresca el badge de estado en la tabla de fondo
          } else {
            e.target.checked = !activo; // revertir si falló
            statusEl.textContent = 'No se pudo guardar el cambio.';
            statusEl.style.color = 'var(--coral)';
          }
        });

        document.getElementById('colorPrimario').addEventListener('change', async (e) => {
          const statusEl = document.getElementById('colorStatus');
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ color_primario: e.target.value })
          });
          if (res) {
            empresa.color_primario = e.target.value;
            statusEl.textContent = 'Guardado.';
            statusEl.style.color = 'var(--teal)';
            document.getElementById('btnQuitarColor').style.display = '';
            await cargarEmpresas();
          }
        });

        document.getElementById('btnQuitarColor').addEventListener('click', async () => {
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ color_primario: null })
          });
          if (res) {
            empresa.color_primario = null;
            document.getElementById('colorPrimario').value = '#E3B23C';
            document.getElementById('btnQuitarColor').style.display = 'none';
            document.getElementById('colorStatus').textContent = '';
            await cargarEmpresas();
          }
        });

        document.getElementById('listaModulos').querySelectorAll('input[type="checkbox"]').forEach(chk => {
          chk.addEventListener('change', async () => {
            const moduloId = chk.dataset.modulo;
            const habilitar = chk.checked;
            chk.disabled = true;
            const res = habilitar
              ? await api(`/superadmin/empresas/${empresa.id}/modulos`, { method: 'POST', body: JSON.stringify({ modulo_id: moduloId }) })
              : await api(`/superadmin/empresas/${empresa.id}/modulos/${moduloId}`, { method: 'DELETE' });
            chk.disabled = false;
            if (res === null) chk.checked = !habilitar; // revertir si falló
            await cargarEmpresas(); // refresca el conteo de módulos en la tabla de fondo
          });
        });

        // Un paquete = tildar (y disparar el 'change' de arriba, que ya
        // hace el POST real) cada checkbox del paquete que todavía no
        // estaba activo -- no se toca ninguno que ya estuviera prendido ni
        // ninguno fuera del paquete.
        body.querySelectorAll('[data-paquete]').forEach(btn => {
          btn.addEventListener('click', () => {
            const paquete = PAQUETES[btn.dataset.paquete];
            paquete.modulos.forEach(moduloId => {
              const chk = body.querySelector(`[data-modulo="${moduloId}"]`);
              if (chk && !chk.checked) {
                chk.checked = true;
                chk.dispatchEvent(new Event('change'));
              }
            });
          });
        });

        document.getElementById('formAdmin').addEventListener('submit', async (e) => {
          e.preventDefault();
          const nombre = document.getElementById('adminNombre').value.trim();
          const email = document.getElementById('adminEmail').value.trim();
          const password = document.getElementById('adminPassword').value;
          const statusEl = document.getElementById('adminStatus');
          const res = await api(`/superadmin/empresas/${empresa.id}/admin`, {
            method: 'POST', body: JSON.stringify({ nombre, email, password: password || undefined })
          });
          if (res) {
            statusEl.textContent = 'Administrador agregado.';
            statusEl.style.color = 'var(--teal)';
            document.getElementById('formAdmin').reset();
            await cargarEmpresas();
          }
        });
      }
    });
  }
</script>
</body>
</html>
